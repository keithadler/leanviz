# Regenerate the Mathlib bundle and publish the site to GitHub Pages.
#
name: pages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # Mondays, 05:17 UTC: after Mathlib's weekend of merges

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      # The runner's disk is tight for a Mathlib cache plus a toolchain; drop what this job never touches.
      - name: Make room
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Check out Mathlib
        uses: actions/checkout@v7
        with:
          repository: leanprover-community/mathlib4
          path: mathlib4
          fetch-depth: 1

      - name: Install elan and the Mathlib cache
        working-directory: mathlib4
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Re-check every declaration with Tenet
        run: |
          dotnet tool install -g tenet
          tenet check mathlib4 --all --quiet --report check.json

      # The reader comes from Tenet's source until 0.9.1 is on nuget.org with the docstring and range readers.
      - name: Build the reader from Tenet's source
        run: |
          git clone --depth 1 https://github.com/keithadler/tenet.git tenet
          dotnet build tenet/src/Tenet.Olean -c Release -f net10.0
          mkdir -p lib
          cp tenet/src/Tenet.Olean/bin/Release/net10.0/Tenet.Kernel.dll tenet/src/Tenet.Olean/bin/Release/net10.0/Tenet.Olean.dll lib/

      - name: Generate the Mathlib bundle
        run: |
          dotnet build generator -c Release
          dotnet generator/bin/Release/net10.0/leanviz.dll mathlib4 --out site/data \
            --slug mathlib --title Mathlib \
            --check check.json --repo "https://github.com/${{ github.repository }}"

      # A signed, transparency-logged statement that this workflow, at this commit, produced these exact files:
      # the check report (the verdict over hashed inputs) and the manifest that cites it. Anyone can confirm with
      #   gh attestation verify check.json --owner <owner>
      # after downloading check.json from the published site.
      - name: Attest the verdict and the manifest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            check.json
            site/data/mathlib/manifest.json

      # Mathlib's build tree is about 7 GB and nothing after this reads it. The second library pins its own
      # toolchain and pulls its own cache, so without this the runner runs out of disk part way through and takes
      # the steps after it down as well.
      - name: Reclaim the Mathlib build tree
        run: |
          df -h / | tail -1
          rm -rf mathlib4/.lake mathlib4/.git
          df -h / | tail -1

      # Never publish a page that does not render: the bundle is fine, the site is three files, and a broken
      # one of those has shipped before.
      - name: Run the page against the bundle
        run: |
          python3 tests/serve.py 8799 site &
          for i in $(seq 1 30); do curl -sf http://localhost:8799/ >/dev/null && break; sleep 1; done
          python3 tests/check_page.py http://localhost:8799

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-mathlib
          path: site/data
          retention-days: 1

  # The second library builds in parallel and cannot hold up the first. It pins its own Mathlib and its own
  # toolchain, takes over an hour to compile, and is allowed to fail: the site then goes out with Mathlib alone.
  navier-stokes:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Make room
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: Check out Navier-Stokes
        uses: actions/checkout@v7
        with:
          repository: openai/NavierStokesAndEuler
          path: nse
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the reader from Tenet's source
        run: |
          git clone --depth 1 https://github.com/keithadler/tenet.git tenet
          dotnet build tenet/src/Tenet.Olean -c Release -f net10.0
          mkdir -p lib
          cp tenet/src/Tenet.Olean/bin/Release/net10.0/Tenet.Kernel.dll \
             tenet/src/Tenet.Olean/bin/Release/net10.0/Tenet.Olean.dll lib/

      - name: Build it
        working-directory: nse
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          lake build

      - name: Re-check it
        run: |
          dotnet tool install -g tenet
          tenet check nse --all --quiet --report nse-check.json

      - name: Generate its bundle
        run: |
          dotnet build generator -c Release
          dotnet generator/bin/Release/net10.0/leanviz.dll nse --out site/data \
            --slug nse --title "Navier-Stokes" \
            --check nse-check.json --repo "https://github.com/${{ github.repository }}"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            nse-check.json
            site/data/nse/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-nse
          path: site/data
          retention-days: 1

  # Assemble whatever bundles were produced and publish. `always()` so a failed second library cannot stop the
  # first from going out, and the page is loaded once more over the assembled site before it is uploaded.
  assemble:
    needs: [build, navier-stokes]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: site/data

      # Each job's bundle carries a projects.json naming only itself, so the merged copy has to be rebuilt from
      # the manifests that are actually here.
      - name: List the bundles that arrived
        run: python3 tools/rebuild_projects.py site/data

      - name: What is being published
        run: |
          cat site/data/projects.json
          du -sh site/data
          du -sh site/data/* | sort -h

      - name: Run the page against the bundles
        run: |
          python3 tests/serve.py 8799 site &
          for i in $(seq 1 30); do curl -sf http://localhost:8799/ >/dev/null && break; sleep 1; done
          python3 tests/check_page.py http://localhost:8799

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
