# Audit a batch of Lean packages: build each one, re-check every declaration with an independent kernel, and
# keep the verdict rather than the bundle.
#
# A bundle is tens of megabytes and the site can hold about 820 of them; 858 packages is tens of gigabytes and
# will never fit. The verdict is a few hundred bytes. So this runs the same pipeline and throws the browsable
# part away, which is what makes an ecosystem-wide answer possible at all.
#
# It answers, per package: does it build, does a second kernel accept every declaration, does anything rest on
# `sorry`, and what does it reach for beyond Lean's three standard axioms.
name: audit

on:
  workflow_dispatch:
    inputs:
      limit:
        description: how many packages to audit in this run
        required: false
        default: "8"
      skip:
        description: how many of the star-ranked list to pass over first
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        run: |
          m=$(python3 tools/reservoir.py --limit "${{ inputs.limit }}" --skip "${{ inputs.skip }}" --json)
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m" | python3 -c "import json,sys; [print('  ', p['repo']) for p in json.load(sys.stdin)]"

  audit:
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true      # one package that will not build must not stop the batch
    strategy:
      fail-fast: false
      max-parallel: 6            # a public runner pool is shared; six at a time is polite and still quick
      matrix:
        pkg: ${{ fromJSON(needs.pick.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Make room
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.pkg.repo }}
          path: project
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Headers a Lean project with C bindings is likely to want
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev libssl-dev zlib1g-dev libsqlite3-dev

      # Both the reader and the checker come from Tenet's source rather than the published tool. The audit is
      # what finds Tenet's bugs: verso's 33 false rejections were a name-resolution fault in checking a whole
      # project, fixed on main and not in any release. An audit running a release could not see its own fix.
      - name: Build the reader and the checker from Tenet's source
        run: |
          git clone --depth 1 https://github.com/keithadler/tenet.git tenet
          dotnet build tenet/src/Tenet.Olean -c Release -f net10.0
          dotnet build tenet/src/Tenet.Cli -c Release
          mkdir -p lib
          cp tenet/src/Tenet.Olean/bin/Release/net10.0/Tenet.Kernel.dll \
             tenet/src/Tenet.Olean/bin/Release/net10.0/Tenet.Olean.dll lib/
          echo "TENET=$PWD/tenet/src/Tenet.Cli/bin/Release/net10.0/tenet.dll" >> "$GITHUB_ENV"
          git -C tenet log --oneline -1 | sed 's/^/  checking with tenet at /'

      - name: Build the package
        id: build
        continue-on-error: true
        working-directory: project
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get || echo "no cache for this project's dependencies"
          lake build

      - name: Re-check it, and keep only the verdict
        id: verdict
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          # A non-zero exit means declarations were rejected, which is a result and not an error here. But a
          # report that was never written, or written empty, must not be handed to the generator as though it
          # were one: the generator is right to refuse a report it cannot make sense of, and the job would die
          # on a package that had simply crashed the checker.
          dotnet "$TENET" check project --all --quiet --report check.json || true
          check=""
          if [ -s check.json ]; then
            check="--check check.json"
          else
            echo "no usable report; recording the package without a verdict"
          fi
          dotnet build generator -c Release
          dotnet generator/bin/Release/net10.0/leanviz.dll project --out /tmp/audit \
            --slug "${{ matrix.pkg.slug }}" --title "${{ matrix.pkg.slug }}" $check \
            --repo "https://github.com/${{ matrix.pkg.repo }}"
          python3 tools/audit_record.py "/tmp/audit/${{ matrix.pkg.slug }}/manifest.json" \
            "${{ matrix.pkg.repo }}" "${{ matrix.pkg.slug }}" \
            --checker-commit "$(git -C tenet rev-parse --short HEAD)" > "record.json"
          cat record.json

      # Every package leaves a record, whatever happened. Without this a package that built but whose audit
      # step failed produced nothing at all and vanished from the count silently, which is the failure mode
      # that makes a total untrustworthy: you cannot tell a package that was not audited from one that was
      # never there. Verso did exactly that on the first batch.
      # Whatever happened, except cancellation. A cancelled job has learned nothing about the package, and a
      # record saying "did not build" would overwrite a real verdict from an earlier batch. Cancelling one run
      # did exactly that and destroyed four good results.
      - name: Leave a record whatever happened
        if: always() && !cancelled()
        run: |
          if [ -s record.json ]; then
            echo "already recorded"
            exit 0
          fi
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            python3 tools/audit_record.py --failed "${{ matrix.pkg.repo }}" "${{ matrix.pkg.slug }}" > record.json
          else
            python3 tools/audit_record.py --unaudited "${{ matrix.pkg.repo }}" "${{ matrix.pkg.slug }}" > record.json
          fi
          cat record.json

      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: audit-${{ matrix.pkg.slug }}
          path: record.json
          retention-days: 5

  collect:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: audit-*
          path: incoming
      - name: Merge into the audit, keeping what earlier runs found
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download audit --pattern 'audit.json' --dir . || echo '[]' > audit.json
          python3 tools/audit_merge.py audit.json incoming
          gh release create audit --title "Ecosystem audit" --notes \
            "What every Lean package in Reservoir assumes, as measured by an independent kernel." 2>/dev/null || true
          gh release upload audit audit.json --clobber
          python3 tools/audit_merge.py --summary audit.json

      # The aggregate goes in the README, where anyone arriving at the repository sees it. Aggregate only:
      # see tools/audit_readme.py for why no package is named.
      - name: Put the aggregate in the README
        run: |
          git config user.name  "Keith Adler"
          git config user.email "271127604+keithadler@users.noreply.github.com"
          # A generated block is never rebased. An audit takes an hour and main moves underneath it, so
          # replaying a commit written against an older README conflicts inside the very section it rewrites,
          # which is what happened on the first batch. Take whatever main says now and regenerate on top of it.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            python3 tools/audit_readme.py audit.json README.md
            if git diff --quiet README.md; then
              echo "the aggregate has not moved"
              exit 0
            fi
            git add README.md
            git commit -q -m "The ecosystem audit, after another batch

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
            if git push -q origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "main moved while we were pushing; regenerating against it"
          done
          echo "could not push the aggregate after three tries; the audit release still has the data"
          exit 1
